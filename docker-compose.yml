# Opcional. O caminho principal de desenvolvimento é o PostgreSQL nativo
# (veja o README). Use este arquivo apenas se preferir rodar o banco em
# container.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
    ports:
      - "5432:5432"
    volumes:
      - hub_pgdata:/var/lib/postgresql/data

volumes:
  hub_pgdata:
